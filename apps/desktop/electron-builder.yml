# empaquetado de Luxy para Windows.
#
# dos salidas a proposito:
#   nsis     -> instalador con asistente, crea acceso directo en el Menu Inicio
#   portable -> un solo .exe para probar sin instalar nada
#
# el acceso directo del Menu Inicio NO es cosmetico: Windows solo entrega
# notificaciones toast a aplicaciones que tienen uno con su AppUserModelID, asi
# que sin instalador las notificaciones de "trabajo terminado" no aparecen.
# electron-builder necesita la version EXACTA para descargar los binarios de
# esa release. Se fija aqui y no en dependencies para que npm pueda seguir
# aplicando parches de seguridad dentro del rango.
electronVersion: 43.2.0

appId: com.luxy.desktop
productName: Luxy
copyright: Luxy

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# el agente corre en un utilityProcess, que necesita un archivo REAL en disco:
# dentro del asar no se puede forkear.
#
# se copia el BUNDLE (out/agent/host-entry.js), no el dist de tsc. El dist trae
# imports de @luxy/shared y zod sin resolver, y en la carpeta de instalacion no
# hay ningun node_modules donde encontrarlos: el proceso moria con
# ERR_MODULE_NOT_FOUND y codigo 1, sin escribir nada en el log.
extraResources:
  - from: out/agent
    to: agent
    filter:
      - 'host-entry.js'

asar: true

# koffi es un modulo NATIVO y su .node no se puede cargar desde dentro del asar:
# Node necesita un archivo real en disco para dlopen. Sin esto, el control de
# raton y teclado falla en la version instalada aunque funcione en desarrollo,
# que es la peor forma posible de descubrirlo.
asarUnpack:
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'

# koffi trae binarios precompilados para cada plataforma y usa N-API 8, que es
# ABI estable: el mismo .node vale para Node y para Electron. Por eso no hay nada
# que reconstruir.
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # instalador con asistente, no de un solo clic: el usuario elige la carpeta
  oneClick: false
  # por usuario, sin UAC. Luxy no necesita privilegios de administrador.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luxy
  # al desinstalar NO se borra %APPDATA%\Luxy: ahi viven la configuracion y los
  # secretos cifrados, y perderlos por una reinstalacion seria inaceptable
  deleteAppDataOnUninstall: false

portable:
  artifactName: Luxy-portable-${version}.exe
